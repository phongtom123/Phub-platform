services:
  - type: web
    name: phub-platform-api
    runtime: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: cd Backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: phub-admin-ui
    runtime: node
    buildCommand: cd ui/adminUI && npm ci --include=dev && npm run build
    startCommand: cd ui/adminUI && npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PHUB_API_BASE_URL
        value: https://phub-platform-api.onrender.com
